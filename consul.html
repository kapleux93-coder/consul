<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Consul — AI-менеджер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --canvas:#EFEDE8; --card:#FFFFFF; --ink:#14161A; --ink2:#2C3037; --ink3:#3C4148;
  --muted:#5F656D; --muted2:#7C828A; --muted3:#8A9098; --muted4:#9AA0A6; --muted5:#A5AAB0; --muted6:#B6BBC1;
  --accent:#F26722; --accent-h:#D8541A; --accent-d:#C9531A; --accent-t:#FFEFE5; --accent-t2:#FFF7F1; --accent-t3:#FFF0E7; --accent-b:#FBE2D0; --accent-ink:#8A5B39; --accent-ink2:#B0764C;
  --soft:#F8F7F4; --soft2:#F5F4F1; --soft3:#FBFAF8; --soft4:#FBFAF8;
  --line:#EDEAE4; --line2:#E7E4DE; --line3:#F1F0EC; --line4:#EFEDE8; --line5:#EAE7E1; --dash:#D9D5CD;
  --green:#1FA971; --green-d:#158257; --green-t:#E8F7F0; --green-l:#3DDC97;
  --blue-t:#EDF3FF; --blue-d:#2E5AAC;
  --dark:#14161A; --dark2:#1F2226; --dark3:#2A2E34; --dark-mut:#9BA1A9;
  --f:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --m:'Space Grotesk',ui-monospace,'SF Mono',menlo,sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--canvas);overflow:hidden}
body{font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
input,textarea,select{font-family:inherit;color:inherit;background:none;border:none;outline:none;width:100%;resize:none}
input::placeholder,textarea::placeholder{color:var(--muted6)}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}

#app{position:fixed;inset:0;max-width:440px;margin:0 auto;background:var(--card);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(30,24,16,.06)}

/* ---------- view system ---------- */
.view{position:absolute;inset:0;display:none;flex-direction:column;background:var(--card);z-index:1}
.view.active{display:flex;z-index:2;animation:vin .26s cubic-bezier(.22,.9,.3,1)}
.view.active.back{animation:vinb .26s cubic-bezier(.22,.9,.3,1)}
@keyframes vin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes vinb{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}

.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.pad{padding:22px 22px 26px;display:flex;flex-direction:column;gap:18px;flex:1}
.pad-core{padding:calc(26px + var(--safe-top)) 20px 20px;display:flex;flex-direction:column;gap:18px;flex:1}
.push{margin-top:auto}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.g4{gap:4px}.g6{gap:6px}.g7{gap:7px}.g8{gap:8px}.g9{gap:9px}.g10{gap:10px}.g11{gap:11px}.g12{gap:12px}.g13{gap:13px}.g14{gap:14px}.g16{gap:16px}.g18{gap:18px}.g20{gap:20px}
.f1{flex:1;min-width:0}
.none{flex:none}
.wrap{flex-wrap:wrap}

/* ---------- topbar ---------- */
.topbar{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line4);margin-top:var(--safe-top)}
.topbar .t{font:600 15px/1 var(--f)}
.topbar .l{font:500 15px/1 var(--f);color:var(--muted3)}
.topbar .r{font:500 14px/1 var(--m);color:var(--muted4)}

/* ---------- progress ---------- */
.steps{display:flex;gap:6px}
.steps i{height:3px;flex:1;border-radius:2px;background:#E9E6E0;transition:background .3s}
.steps i.on{background:var(--accent)}

/* ---------- type ---------- */
.h1{font:600 36px/1.1 var(--f);letter-spacing:-.03em}
.h2{font:600 28px/1.15 var(--f);letter-spacing:-.025em}
.h3{font:600 26px/1.12 var(--f);letter-spacing:-.02em}
.h4{font:600 24px/1.1 var(--f);letter-spacing:-.02em}
.h5{font:600 16px/1 var(--f)}
.sub{font:400 15px/1.5 var(--f);color:var(--muted2);text-wrap:pretty}
.sub-s{font:400 14px/1.5 var(--f);color:var(--muted2);text-wrap:pretty}
.lbl{font:500 11px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--muted4)}
.cap{font:400 13px/1.4 var(--f);color:var(--muted4)}
.cap2{font:400 12px/1.3 var(--f);color:var(--muted4)}
.num{font-family:var(--m)}

/* ---------- controls ---------- */
.btn{height:54px;border-radius:15px;background:var(--accent);display:flex;align-items:center;justify-content:center;gap:8px;font:600 16px/1 var(--f);color:#fff;width:100%;transition:transform .09s ease,opacity .15s}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.dark{background:var(--dark)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink);height:48px;font-size:15px}
.btn.tint{background:var(--accent-t);color:var(--accent-d);height:48px;font-size:15px;border-radius:14px}
.btn.sm{height:44px;border-radius:13px;font-size:14px}
.link{height:42px;display:flex;align-items:center;justify-content:center;font:500 15px/1 var(--f);color:var(--muted3);width:100%}
.a{color:var(--accent);font:500 13px/1 var(--f)}
.a15{color:var(--accent);font:500 15px/1 var(--f)}

.field{display:flex;flex-direction:column;gap:7px}
.inp{border:1px solid var(--line2);border-radius:13px;padding:14px;font:500 15px/1.35 var(--f);background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:10px;transition:border-color .18s}
.inp:focus-within{border-color:var(--accent)}
.inp.mono input{font-family:var(--m)}
.inp textarea{min-height:64px;line-height:1.45;font-weight:400;color:var(--ink3)}
.inp.err{border-color:#E04B4B}
.hint{font:400 13px/1.45 var(--f);color:var(--muted4)}
.hint.err{color:#C93A3A}

.seg{display:flex;gap:8px}
.seg button{flex:1;border-radius:13px;background:var(--soft);border:1px solid var(--line);color:var(--muted);padding:13px 0;text-align:center;font:500 14px/1 var(--f);transition:.15s}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.chip{border-radius:999px;background:var(--soft2);color:var(--muted);padding:9px 14px;font:500 13px/1 var(--f);white-space:nowrap;transition:.15s}
.chip.on{background:var(--dark);color:#fff}
.chip.warm{background:var(--accent-t3);color:var(--accent-d)}
.chip.warm.on{background:var(--accent-d);color:#fff}
.chip.tag{background:var(--accent-t);color:var(--accent-d);padding:9px 14px;font-size:14px}
.chip.add{background:var(--soft);border:1px solid var(--line);color:var(--muted2);font-size:14px}
.chip.out{background:transparent;border:1px solid var(--line2);color:var(--muted4)}

.sw{width:42px;height:26px;border-radius:13px;background:#E2DFD8;position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .2s cubic-bezier(.3,1.4,.5,1);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.sw.on{background:var(--accent)}
.sw.on i{left:19px}

.box{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:16px}
.box.plain{background:var(--card);border-color:var(--line)}
.box.warm{background:var(--accent-t2);border-color:var(--accent-b);font:400 14px/1.45 var(--f);color:var(--accent-ink)}
.list{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:0 16px}
.list>*{padding:14px 0;border-bottom:1px solid var(--line5)}
.list>*:last-child{border-bottom:none}
.list.plain{background:var(--card);border-color:var(--line);border-radius:20px}
.list.plain>*{border-bottom-color:var(--line3);padding:16px 0}

.av{border-radius:14px;background:var(--soft2);color:var(--muted2);font:600 14px/1 var(--m);display:flex;align-items:center;justify-content:center;flex:none}
.av.warm{background:var(--accent-t);color:var(--accent)}
.badge{border-radius:999px;padding:5px 10px;font:600 10px/1 var(--m);letter-spacing:.04em;white-space:nowrap}
.badge.att{background:var(--accent-t3);color:var(--accent-d)}
.badge.ai{background:var(--line3);color:var(--muted2)}
.badge.human{background:var(--blue-t);color:var(--blue-d)}
.badge.ok{background:var(--green-t);color:var(--green-d)}
.dot{width:6px;height:6px;border-radius:3px;background:var(--green);flex:none}
.pill-live{display:flex;align-items:center;gap:6px;background:var(--green-t);border-radius:999px;padding:6px 10px;font:600 11px/1 var(--m);color:var(--green-d)}
.tick{width:18px;height:18px;border-radius:9px;background:var(--green);display:flex;align-items:center;justify-content:center;flex:none}

.darkcard{background:var(--dark);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px;color:#fff}
.darkcard .kpi{flex:1;background:var(--dark2);border-radius:14px;padding:13px}
.darkcard .kpi b{font:600 22px/1 var(--m);color:#fff;display:block}
.darkcard .kpi span{font:400 12px/1.3 var(--f);color:var(--muted3);display:block;padding-top:5px}

.stat{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:15px;display:flex;flex-direction:column;gap:6px}
.stat b{font:600 26px/1 var(--m)}
.stat span{font:400 12px/1.3 var(--f);color:var(--muted3)}
.stat.warm{background:var(--accent-t2);border-color:var(--accent-b)}
.stat.warm b{color:var(--accent-d)}
.stat.warm span{color:var(--accent-ink2)}

.drop{border:1px dashed var(--dash);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:5px;transition:.15s}
.drop:active{background:var(--soft)}
.drop b{font:600 14px/1 var(--f)}
.drop span{font:400 12px/1.3 var(--f);color:var(--muted4)}

/* ---------- chat ---------- */
.bub{max-width:82%;padding:11px 14px;font:400 14px/1.45 var(--f);animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub.out{align-self:flex-end;background:var(--accent);color:#fff;border-radius:16px 16px 5px 16px}
.bub.in{align-self:flex-start;background:var(--card);border:1px solid var(--line4);border-radius:16px 16px 16px 5px;max-width:84%}
.bub.in.flat{background:var(--soft2);border:none;color:var(--ink2)}
.bub.sys{align-self:center;background:var(--accent-t3);border-radius:14px;color:var(--accent-d);font:500 13px/1.4 var(--f);text-align:center;max-width:88%}
.meta{font:500 11px/1 var(--f);color:var(--muted5)}
.typing{align-self:flex-start;background:var(--card);border:1px solid var(--line4);border-radius:16px 16px 16px 5px;padding:13px 15px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:3px;background:var(--muted6);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.composer{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:10px 10px 10px 14px}
.composer input{font:400 14px/1.2 var(--f)}
.send{width:32px;height:32px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;transition:.12s}
.send:active{transform:scale(.9)}

/* ---------- inbox rows ---------- */
.dlg{display:flex;gap:12px;padding:14px 20px;transition:background .12s}
.dlg:active{background:var(--soft2)}
.dlg.unread{background:#FFF9F5;border-left:2px solid var(--accent);padding-left:18px}
.sep{height:1px;background:var(--line3);margin:0 20px}

/* ---------- tabbar ---------- */
.tabbar{display:flex;justify-content:space-between;align-items:stretch;padding:8px 10px calc(16px + var(--safe-bot));background:var(--card);border-top:1px solid #ECECE8;flex:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:6px;position:relative;transition:.12s}
.tab:active{transform:scale(.93)}
.tab span{font:500 10px/1 var(--f);letter-spacing:.02em;color:var(--muted4)}
.tab svg{stroke:var(--muted4)}
.tab.on span{color:var(--accent)}
.tab.on svg{stroke:var(--accent)}
.tab.on svg.fill circle{fill:var(--accent)}
.tab svg.fill circle{fill:var(--muted4)}
.tab .bdg{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font:700 9px/16px var(--f);text-align:center;padding:0 4px}

/* ---------- bars ---------- */
.bars{display:flex;align-items:flex-end;gap:5px;height:70px}
.bars i{flex:1;background:var(--dark3);border-radius:3px;transition:height .5s cubic-bezier(.3,1,.4,1)}
.bars i.on{background:var(--accent)}
.track{width:110px;height:6px;border-radius:3px;background:var(--line3);flex:none;overflow:hidden}
.track i{display:block;height:6px;border-radius:3px;background:var(--accent);transition:width .5s ease}
.ring{width:46px;height:46px;border-radius:50%;flex:none;background:conic-gradient(var(--accent) var(--p,62%),#E9E6E0 0);position:relative}
.ring:after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--soft)}
.slider{height:4px;border-radius:2px;background:#E9E6E0;position:relative;margin:9px 0}
.slider i{position:absolute;left:0;top:0;height:4px;border-radius:2px;background:var(--accent)}
.slider b{position:absolute;top:-7px;width:18px;height:18px;border-radius:9px;background:#fff;border:2px solid var(--accent);margin-left:-9px}
.slider input{position:absolute;inset:-12px 0;opacity:0;height:28px}

/* ---------- sheet / toast ---------- */
.scrim{position:absolute;inset:0;background:rgba(20,22,26,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .24s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:26px 26px 0 0;padding:20px 20px calc(22px + var(--safe-bot));display:flex;flex-direction:column;gap:16px;transform:translateY(102%);transition:transform .3s cubic-bezier(.22,.9,.3,1);max-height:86%;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line2);align-self:center}
.toast{position:absolute;left:16px;right:16px;top:calc(12px + var(--safe-top));z-index:60;background:var(--dark);color:#fff;border-radius:15px;padding:14px 16px;font:500 14px/1.4 var(--f);opacity:0;transform:translateY(-10px);pointer-events:none;transition:.24s;box-shadow:0 12px 30px rgba(20,16,10,.28)}
.toast.on{opacity:1;transform:none}

.skel{background:linear-gradient(90deg,var(--soft2) 25%,#EDEBE6 50%,var(--soft2) 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .3s ease}
@keyframes fd{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div id="screens" style="position:relative;flex:1;overflow:hidden"></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
'use strict';
/* ============================================================
   Consul — AI-менеджер для Telegram-бота
   Telegram Mini App. Одностраничное приложение, состояние в localStorage.
   ============================================================ */

const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const KEY = 'consul_state_v1';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const now = () => Date.now();
const hhmm = t => { const d = new Date(t); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const initials = s => String(s||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '??';
/** Русские окончания: plural(2,'диалог','диалога','диалогов') */
function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b > 1 && b < 5) return few;
  if(b === 1) return one;
  return many;
}

function haptic(type){
  try{
    if(!TG || !TG.HapticFeedback) return;
    if(type === 'sel') TG.HapticFeedback.selectionChanged();
    else if(type === 'ok') TG.HapticFeedback.notificationOccurred('success');
    else if(type === 'warn') TG.HapticFeedback.notificationOccurred('warning');
    else TG.HapticFeedback.impactOccurred(type || 'light');
  }catch(e){}
}

/* ---------- icons ---------- */
const I = {
  msg: (c,s) => `<svg width="${s||19}" height="${s||19}" viewBox="0 0 24 24" fill="none" stroke="${c||'#F26722'}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16v9.5a2 2 0 0 1-2 2H9l-5 3.5V5.5Z"/></svg>`,
  user: (c,s) => `<svg width="${s||19}" height="${s||19}" viewBox="0 0 24 24" fill="none" stroke="${c||'#F26722'}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c1.2-3.6 3.9-5.2 7-5.2s5.8 1.6 7 5.2"/></svg>`,
  trend:(c,s) => `<svg width="${s||19}" height="${s||19}" viewBox="0 0 24 24" fill="none" stroke="${c||'#F26722'}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5 9 11.5l3.5 3.5L20 7.5"/><path d="M20 12.5v-5h-5"/></svg>`,
  bell: (c,s) => `<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="${c||'#5F656D'}" stroke-width="1.8" stroke-linecap="round"><path d="M12 4a5.5 5.5 0 0 0-5.5 5.5c0 4-2 5.5-2 5.5h15s-2-1.5-2-5.5A5.5 5.5 0 0 0 12 4Z"/><path d="M10.5 18.5a1.8 1.8 0 0 0 3 0"/></svg>`,
  search:(c,s)=> `<svg width="${s||16}" height="${s||16}" viewBox="0 0 24 24" fill="none" stroke="${c||'#A5AAB0'}" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5 20 20"/></svg>`,
  check:(c,s) => `<svg width="${s||11}" height="${s||11}" viewBox="0 0 24 24" fill="none" stroke="${c||'#fff'}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg>`,
  arrow:(c,s) => `<svg width="${s||16}" height="${s||16}" viewBox="0 0 24 24" fill="none" stroke="${c||'#fff'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h14"/><path d="M13 6.5 18.5 12 13 17.5"/></svg>`,
  pause:(c,s) => `<svg width="${s||11}" height="${s||11}" viewBox="0 0 24 24" fill="none" stroke="${c||'#F26722'}" stroke-width="2.6" stroke-linecap="round"><path d="M9.5 6v12"/><path d="M14.5 6v12"/></svg>`,

/* ============================================================
   Связь с бэкендом.

   Сервер (consul-server) отдаёт этот файл, подставляя window.CONSUL_CONFIG.
   Если конфига нет — файл открыт как есть, приложение работает офлайн
   на локальных данных, как демо. Логика экранов одна и та же.
   ============================================================ */
const CFG = window.CONSUL_CONFIG || null;
const NET = {
  on: !!CFG,
  base: CFG ? (CFG.api || location.origin) : '',
  bot: CFG ? (CFG.bot || '') : '',   // username платформенного бота Consul
  initData: (TG && TG.initData) || (CFG && CFG.devInitData) || '',
  ready: false,
  aiReady: false,
  me: null,
  async req(path, body){
    const res = await fetch(this.base + path, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-init-data': this.initData },
      body: JSON.stringify(body || {}),
    });
    let data = null;
    try { data = await res.json(); } catch(e){}
    if(!res.ok || !data || data.ok === false) throw new Error((data && data.error) || ('сервер ответил ' + res.status));
    return data;
  },
  /** Отправляет файл целиком: разбор PDF/DOCX/XLSX делает сервер. */
  async upload(file, title){
    const res = await fetch(this.base + '/api/knowledge/upload', {
      method: 'POST',
      headers: {
        'x-init-data': this.initData,
        'x-filename': encodeURIComponent(file.name),
        'content-type': 'application/octet-stream',
      },
      body: file,
    });
    let data = null;
    try { data = await res.json(); } catch(e){}
    if(!res.ok || !data || data.ok === false) throw new Error((data && data.error) || ('сервер ответил ' + res.status));
    return data;
  },
};

function netErr(e){
  console.error('[net]', e);
  toast(e && e.message ? e.message : 'Нет связи с сервером');
}
function debounce(fn, ms){
  let t = null;
  return function(){ clearTimeout(t); t = setTimeout(fn, ms); };
}
const pushBiz = debounce(() => { if(NET.on) NET.req('/api/biz', S.biz).catch(netErr); }, 700);
const pushAI  = debounce(() => { if(NET.on) NET.req('/api/ai', { patch: S.ai }).catch(netErr); }, 500);
const pushStep = debounce(() => { if(NET.on) NET.req('/api/step', { step: S.step }).catch(()=>{}); }, 800);

/** Переносит состояние с сервера в S, сохраняя форму, которую ждут экраны. */
/* Часовой пояс устройства владельца. Тихие часы сервер считает по нему: без
 * этого «не писать ночью с 22:00» означало бы 22:00 в Москве, и клиенту во
 * Владивостоке бот написал бы в четыре утра. */
function deviceTz(){
  const h = -Math.round(new Date().getTimezoneOffset() / 60);
  return Math.max(-12, Math.min(14, h));
}
function tzLabel(off){
  const h = off ?? deviceTz();
  return 'UTC' + (h >= 0 ? '+' : '−') + Math.abs(h);
}

function applyState(st){
  if(!st) return;
  S.onboarded = st.onboarded;
  S.step = st.step || 0;
  S.bot = { token:'', name: st.bot.name, username: st.bot.username, subs: st.bot.subs, connected: st.bot.connected, mask: st.bot.tokenMask };
  S.biz = Object.assign({ docs: S.biz.docs || [] }, st.biz);
  // Собираем от дефолтов, а не поверх текущего: иначе удалённые на сервере
  // поля (например, снятый профиль стиля) остались бы висеть в клиенте.
  S.ai = Object.assign({}, seed().ai, st.ai);
  // Сервер не знает, где находится владелец, и по умолчанию считает время по
  // Москве. Подсказываем ему пояс устройства — иначе тихие часы сдвинуты.
  const tz = deviceTz();
  if(NET.on && S.ai.tzOffset !== tz){ S.ai.tzOffset = tz; pushAI(); }
  S.team = st.team || [];
  S.depts = st.depts || S.depts;
  S.knowledge = st.knowledge || [];
  S.dialogs = st.dialogs || [];
  S.counters = st.counters || S.counters;
  S.usage = st.usage || null;
  NET.aiReady = !!st.ai_ready;
  NET.mode = st.mode;
  NET.quota = st.quota || null;
  NET.links = st.links || {};
  NET.notifyOk = st.notifyOk !== false;
  save();
}

/** Точечное обновление одного диалога (приходит по SSE и из ответов API). */
function applyDialog(d){
  if(!d) return;
  const i = S.dialogs.findIndex(x => x.id === d.id);
  if(i >= 0) S.dialogs[i] = d; else S.dialogs.unshift(d);
  S.dialogs.sort((a,b) => b.ts - a.ts);
  save();
  if(current === 'chat' && S.openChat === d.id) refreshChat();
  else if(current === 'inbox'){ const n = $('#inboxList'); if(n) n.innerHTML = inboxRows(); repaintBadge(); }
  else if(current === 'home' || current === 'clients') paint(current, false);
  else repaintBadge();
}
function repaintBadge(){
  const tab = $('.tab[data-tab="inbox"]'); if(!tab) return;
  const n = unreadCount(), b = $('.bdg', tab);
  if(n && b) b.textContent = n;
  else if(n && !b){ const d = document.createElement('div'); d.className = 'bdg'; d.textContent = n; tab.appendChild(d); }
  else if(!n && b) b.remove();
}

/** Живой поток изменений: новые сообщения клиентов приходят сюда. */
let ES = null;
function openStream(){
  if(!NET.on || !NET.initData || ES) return;
  try {
    ES = new EventSource(NET.base + '/api/stream?initData=' + encodeURIComponent(NET.initData));
  } catch(e){ return; }
  ES.addEventListener('dialog', e => {
    try {
      const p = JSON.parse(e.data);
      if(p.counters) S.counters = p.counters;
      if(p.usage) S.usage = p.usage;
      applyDialog(p.dialog || p);
    } catch(err){}
  });
  ES.addEventListener('state', e => { try { applyState(JSON.parse(e.data)); paint(current, false); } catch(err){} });
  ES.onopen = () => {
    if(NET.offline){
      // Связь вернулась — забираем то, что пропустили, пока были офлайн.
      NET.offline = false;
      NET.req('/api/state', {}).then(r => { applyState(r.state); paint(current, false); }).catch(()=>{});
    }
  };
  ES.onerror = () => {
    // EventSource переподключается сам; наше дело — показать, что связи нет.
    if(ES.readyState === 2 || ES.readyState === 0){
      if(!NET.offline){ NET.offline = true; if(current === 'home') paint('home', false); }
    }
  };
}

/* ---------- AI движок ---------- */
function findProduct(q){
  const s = q.toLowerCase();
  let best = null, score = 0;
  CATALOG.forEach(p => {
    let sc = 0;
    p.tag.split(' ').forEach(w => { if(w.length > 3 && s.includes(w.slice(0, w.length - 1))) sc++; });
    if(sc > score){ score = sc; best = p; }
  });
  const budget = (s.match(/до\s*(\d[\d\s]{2,})/) || [])[1];
  if(budget && !best){
    const lim = +budget.replace(/\s/g,'');
    const fit = CATALOG.filter(p => p.p <= lim).sort((a,b)=>b.p-a.p);
    if(fit.length) return { p: fit[0], alt: fit.length, budget: lim };
  }
  return best ? { p: best, alt:0, budget: budget ? +budget.replace(/\s/g,'') : 0 } : null;
}
function tone(txt){
  if(S.ai.style === 'friendly') return txt;
  if(S.ai.style === 'neutral')  return txt.replace(/^Здравствуйте! /,'').replace(/ 🙂/,'');
  return txt.replace(/^Здравствуйте! /,'Добрый день. ').replace(/Покажу/,'Направлю');
}
function trim(sentences){
  const v = S.ai.lengthVal;
  const n = v < 34 ? 2 : v < 67 ? 3 : 5;
  return sentences.slice(0, n).join(' ');
}
/** Возвращает {text, handoff, reason, source} */
function aiReply(input){
  const s = input.toLowerCase();
  // 1) правила передачи человеку
  const trig = S.ai.handoff.find(h => {
    const k = h.toLowerCase();
    if(k.includes('менеджер')) return /менеджер|человек|оператор|живой/.test(s);
    if(k.includes('жалоб'))    return /жалоб|верн(у|и)ть|брак|не работает|обман|претенз/.test(s);
    if(k.includes('счёт')||k.includes('счет')||k.includes('документ')) return /счёт|счет|инн|юрлиц|договор|документ|накладн/.test(s);
    return s.includes(k.split(' ')[0]);
  });
  if(trig) return { handoff:true, reason:trig, text:'Секунду, подключаю менеджера — он ответит здесь же.' };
  if(/счёт|счет|инн|юрлиц|договор/.test(s)) return { handoff:true, reason:'запрос счёта и документов', text:'Передаю запрос менеджеру — он подготовит счёт.' };

  // 2) запрещённые темы
  const banned = S.ai.banned.find(b => { const k = b.toLowerCase().split(/[\s>]/)[0]; return k.length > 3 && s.includes(k); });
  if(banned) return { text: tone('Этот вопрос я не обсуждаю — могу помочь с подбором, ценами и доставкой.'), handoff:false };

  // 3) скидки
  if(/скидк|дешевле|торг/.test(s)){
    if(!S.ai.canDiscount) return { handoff:true, reason:'запрос скидки', text:'Про скидку уточню у менеджера — он ответит здесь.' };
    return { text: tone('Могу дать 5% при заказе от 3 позиций. Оформляем?'), handoff:false };
  }
  // 4) доставка
  if(/доставк|привез|срок|когда придёт|когда придет|отправ/.test(s)){
    const known = /казан|москв/.test(s);
    const city = /казан/.test(s) ? DELIVERY.kzn : /москв/.test(s) ? DELIVERY.msk : DELIVERY.ru;
    const parts = ['Доставка: ' + city + '.', 'Собираем заказ в день оплаты.'];
    if(!known) parts.push('Подскажите город — посчитаю точнее.');
    const rules = S.knowledge.find(k => k.kind === 'rules' && k.ready);
    return { text: tone(trim(parts)), handoff:false, source: rules ? rules.title : null };
  }
  // 5) контакты
  if(S.ai.canContacts && /(\+7|8)\d{9,}|@|почт|телефон/.test(s)){
    return { text: tone(trim(['Записала контакт, спасибо.','Менеджер свяжется, если понадобится уточнить детали.','Что подобрать?'])), handoff:false };
  }
  // 6) товары и цены
  if(S.ai.canProducts){
    const f = findProduct(s);
    if(f){
      const p = f.p, price = nf(p.p) + ' ₽';
      const parts = [];
      if(f.budget) parts.push('В этот бюджет подходит ' + p.n + ' — ' + price + '.');
      else parts.push(p.n + ' — ' + price + '.');
      parts.push(p.d.charAt(0).toUpperCase() + p.d.slice(1) + '.');
      if(p.bulk) parts.push('При заказе ' + p.bulk + '.');
      parts.push('Показать фото и наличие?');
      const src = S.knowledge.find(k => k.kind === 'doc') || S.knowledge.find(k => k.kind === 'price');
      return { text: tone(trim(parts)), handoff:false, source: src ? src.title : 'Каталог' };
    }
    if(/есть|наличи|цен|сколько|стои/.test(s)){
      return { text: tone(trim(['Уточните, что именно ищете — комнату или задачу.','Подберу модель и назову цену сразу.'])), handoff:false };
    }
  }
  // 7) приветствие / общее
  if(/привет|здравств|добрый|hi|hello/.test(s))
    return { text: tone(trim(['Здравствуйте! Я ' + S.ai.name + ', помогу с подбором света.','Что ищете — люстру, торшер, подсветку?'])), handoff:false };
  return { text: tone(trim(['Подскажу по товарам, ценам и доставке.','Опишите задачу — подберу вариант.', 'Если нужен человек — сразу передам менеджеру.'])), handoff:false };
}

  if(current === view && !opts.force) return;
  if(!opts.back && current && !ONB.includes(view)) {
    if(TABS_OF[view] && TABS_OF[current] && TABS_OF[view] !== TABS_OF[current]) stack = [];
    else if(current !== view) stack.push(current);
  }
  if(opts.back) stack.pop();
  paint(view, !!opts.back);
}

function back(){
  if(current === 'team' && teamEdit){ teamEdit = false; paint('more', true); return; }
  if(current === 'styletrain'){ train = null; paint('aiset', true); return; }
  if(ONB.includes(current)){
    const i = ONB.indexOf(current);
    if(i > 0){ S.step = Math.max(0, i - 1); save(); paint(ONB[i-1], true); return; }
  }
  const prev = stack.pop();
  paint(prev || (S.onboarded ? 'home' : 'welcome'), true);
}

function paint(view, isBack){
  current = view; S.view = view; save();
  const fn = VIEWS[view];
  if(!fn) return;
  SCREENS.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'view active' + (isBack ? ' back' : '');
  el.id = 'v-' + view;
  el.innerHTML = fn();
  SCREENS.appendChild(el);
  if(MOUNT[view]) MOUNT[view](el);
  const b = $('.body', el); if(b) b.scrollTop = 0;
  syncBackButton();
}

function syncBackButton(){
  if(!TG || !TG.BackButton) return;
  const rootish = ['home','inbox','clients','aiset','more','welcome'].includes(current);
  try{ rootish ? TG.BackButton.hide() : TG.BackButton.show(); }catch(e){}
}

let testLog = [];
MOUNT.test = el => {
  const feed = $('#testFeed', el);
  // Офлайн-демо начинает с готового диалога. С бэкендом каждый ответ — реальный

  if(!testLog.length && !NET.on) testLog = [{ r:'user', t:'Здравствуйте! Есть торшер для гостиной до 15 000?' }];
  renderTestFeed(feed, true);

function renderTestFeed(feed, replayLast){
  if(!testLog.length){
    feed.innerHTML = `<div class="cap" style="text-align:center;padding:18px 6px">Напишите боту как клиент — или выберите вопрос ниже.</div>`;
    return;
  }
  feed.innerHTML = testLog.map(m => m.r === 'user'
    ? `<div class="bub out">${esc(m.t)}</div>`
    : `<div class="bub in flat">${esc(m.t)}</div>` + (m.ms ? `<div class="row g6" style="padding-left:4px">
        <div style="width:5px;height:5px;border-radius:3px;background:var(--accent)"></div>
        <div style="font:500 12px/1 var(--f);color:var(--muted4)">Ответил AI · ${m.ms} сек${m.src ? ' · источник: ' + esc(m.src) : ''}${m.model ? ' · ' + esc(m.model) : ''}</div></div>` : '')).join('');
  if(replayLast && testLog.length === 1 && !testLog[0].asked){ testLog[0].asked = true; setTimeout(()=>testAnswer(testLog[0].t), 500); }
  feed.scrollTop = feed.scrollHeight;
}
async function testAnswer(q){
  const feed = $('#testFeed'); if(!feed) return;
  const typ = document.createElement('div'); typ.className = 'typing'; typ.innerHTML = '<i></i><i></i><i></i>';
  feed.appendChild(typ);
  feed.scrollTop = feed.scrollHeight;

  if(NET.on){
    try {
      const r = await NET.req('/api/ai/test', { text: q, reset: testLog.length <= 1 });
      testLog.push({
        r: 'ai', t: r.reply,
        src: r.handoff ? null : (r.sources && r.sources[0]) || null,
        ms: r.fallback ? null : (r.ms / 1000).toFixed(1),
        model: r.fallback ? '' : (r.model || ''),
      });
      if(r.fallback) testLog.push({ r:'ai', t:'⚠️ AI недоступен' + (r.error ? ': ' + r.error : '') + '. Диалог ушёл человеку — выдумывать ответ бот не станет.' });
      else if(r.handoff) testLog.push({ r:'ai', t:'⚡ Диалог передан менеджеру' + (r.reason ? ' — ' + r.reason : '') });
      renderTestFeed(feed); haptic('light');
    } catch(e){
      if(typ.parentElement) typ.remove();
      netErr(e);
    }
    return;
  }

  setTimeout(()=>{
    const r = aiReply(q);
    testLog.push({ r:'ai', t:r.text, src: r.handoff ? null : (r.source || null), ms:(0.8 + Math.random()*0.9).toFixed(1) });
    if(r.handoff) testLog.push({ r:'ai', t:'⚡ Диалог передан менеджеру — правило: «' + r.reason + '»' });
    renderTestFeed(feed);
    haptic('light');
  }, 900);
}
function testSend(q){
  const inp = $('#testInp');
  const text = (q || (inp ? inp.value : '')).trim();
  if(!text) return;
  if(inp) inp.value = '';
  testLog.push({ r:'user', t:text });
  renderTestFeed($('#testFeed'));
  testAnswer(text);
}

function lastLine(d){
  const m = d.msgs[d.msgs.length-1]; if(!m) return '';
  if(m.r === 'human') return m.t;
  if(m.r === 'sys') return m.t;
  return m.t;
}
/** Среднее время ответа AI по фактическим замерам. */
function avgReply(){
  if(!NET.on) return '1.4с';
  const t = [];
  S.dialogs.forEach(d => d.msgs.forEach(m => { if(m.ms) t.push(m.ms); }));
  if(!t.length) return '—';
  return (t.reduce((a,b)=>a+b,0) / t.length / 1000).toFixed(1) + 'с';
}

function lastAgo(){
  const t = S.dialogs.reduce((a,d)=>Math.max(a, d.ts), 0);
  if(!t) return 'пока никто не писал';
  const s = Math.max(1, Math.round((now()-t)/1000));
  if(s < 60) return s + ' сек назад';
  if(s < 90) return s + ' секунд назад';
  const m = Math.round(s/60); if(m < 60) return m + ' мин назад';
  return Math.round(m/60) + ' ч назад';
}

function chatMsgs(d){

  const d = new Date(ts||now()), t = new Date();

  const y = new Date(t - 864e5);
  if(d.toDateString() === y.toDateString()) return 'ВЧЕРА';
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'}).toUpperCase();
}

  const inp = $('#chatInp'); const text = inp.value.trim(); if(!text) return;
  inp.value = '';

  if(NET.on){

      refreshChat(); netErr(e);
      if(inp) inp.value = text;

/** Симуляция входящего сообщения клиента + автоответ AI */
function simulateIncoming(d, text){
  d.msgs.push({ r:'user', t:text, ts:now() }); d.ts = now(); S.counters.msgs++;
  save(); refreshChat();
  if(d.status === 'human' || S.ai.paused) return;
  const el = $('#v-chat'); if(!el) return;
  const f = $('#chatFeed', el);
  const typ = document.createElement('div'); typ.className = 'typing'; f.appendChild(typ);
  typ.innerHTML = '<i></i><i></i><i></i>';
  $('.body', el).scrollTop = 99999;
  setTimeout(()=>{
    const r = aiReply(text);
    if(r.handoff){
      d.msgs.push({ r:'ai', t:r.text, ts:now() });
      d.msgs.push({ r:'sys', t:'AI передал диалог: ' + r.reason, ts:now() });
      d.status = 'attention'; S.counters.handed++;
      haptic('warn');
    } else {
      d.msgs.push({ r:'ai', t:r.text, ts:now() }); S.counters.byAi++; S.counters.msgs++;
      haptic('light');
    }
    save(); refreshChat();
  }, 1000);
}

function scenarioCards(){

  if(!list.length) return `<div class="box plain skel" style="height:60px;border-radius:16px"></div>`;
  return list.map(sc=>`<button class="box plain" style="border-radius:16px;padding:15px;display:flex;align-items:center;gap:12px;width:100%;text-align:left" data-act="train-start" data-sc="${esc(sc.id)}">

    <div style="color:#C4C8CD;font:400 18px/1 var(--f)">›</div>
  </button>`).join('');
}

function trainMsgs(){
  const t = train || { log: [] };
  return t.log.map(m => m.r === 'client'
    ? `<div class="bub in">${esc(m.t)}</div>`
    : `<div class="bub out">${esc(m.t)}</div>`).join('') +
    (t.busy ? `<div class="typing"><i></i><i></i><i></i></div>` : '');
}

MOUNT.styletrain = el => {
  if(!train) train = { scenarios: null, log: [] };
  if(!train.scenarios){
    NET.req('/api/style/scenarios', {}).then(r => {
      train.scenarios = r.scenarios;
      const n = $('#scenarios', el); if(n) n.innerHTML = scenarioCards();
    }).catch(netErr);
  }
  const inp = $('#trainInp', el);
  if(inp){ inp.addEventListener('keydown', e => { if(e.key === 'Enter') trainSend(); }); inp.focus(); }
  const f = $('#trainFeed', el); if(f) f.parentElement.scrollTop = f.parentElement.scrollHeight;
};

function refreshTrain(){
  const el = $('#v-styletrain'); if(!el) return;
  const f = $('#trainFeed', el);
  if(!f) return paint('styletrain', false);
  f.innerHTML = trainMsgs();
  f.parentElement.scrollTop = f.parentElement.scrollHeight;
}

/** Просит у сервера следующую реплику клиента. */
async function trainNext(){
  train.busy = true; refreshTrain();
  try {
    const r = await NET.req('/api/style/next', { history: train.log, scenario: train.scenario.id });
    train.log.push({ r: 'client', t: r.message });
    train.done = r.done;
  } catch(e){ netErr(e); }
  train.busy = false;
  paint('styletrain', false);
}

async function trainSend(){
  const inp = $('#trainInp'); if(!inp) return;
  const text = inp.value.trim(); if(!text || train.busy) return;
  inp.value = '';
  train.log.push({ r: 'owner', t: text });
  haptic('light');
  await trainNext();
}

const PERIODS = { 7:{msgs:964,dt:'+11%',cl:52,rate:89,hand:88,bars:[42,58,50,71,63,84,77]},
                  30:{msgs:4128,dt:'+18%',cl:214,rate:91,hand:371,bars:[38,52,44,66,58,78,71,88,62,96]},

/** Считает аналитику по фактическим диалогам за выбранный период. */
function realAnalytics(){
  const days = S.period, since = now() - days * 864e5;
  const msgs = [], byDay = new Array(Math.min(days, 12)).fill(0);
  const bucket = 864e5 * days / byDay.length;
  let total = 0, ai = 0, handed = 0, newCl = 0;
  S.dialogs.forEach(d => {
    // новый клиент = диалог, который начался внутри периода
    const first = d.msgs.length ? d.msgs[0].ts : d.ts;
    if(first >= since) newCl++;
    d.msgs.forEach(m => {
      if(m.ts < since) return;
      total++;
      if(m.r === 'ai') ai++;
      if(m.r === 'sys' && /передал диалог/.test(m.t)) handed++;
      const i = Math.min(byDay.length - 1, Math.floor((m.ts - since) / bucket));
      byDay[i]++;
    });
  });
  const peak = Math.max(1, ...byDay);
  const answered = ai + handed;
  const times = [];
  S.dialogs.forEach(d => d.msgs.forEach(m => { if(m.ms) times.push(m.ms); }));
  const avg = times.length ? (times.reduce((a,b)=>a+b,0) / times.length / 1000).toFixed(1) + 'с' : '—';
  return {
    msgs: total,
    dt: '',
    cl: newCl,
    rate: answered ? Math.round((answered - handed) / answered * 100) : 0,
    hand: handed,
    avg,
    bars: byDay.map(v => Math.max(4, Math.round(v / peak * 100))),
    empty: total === 0,
  };
}

/** Разбивка вопросов по темам — по ключевым словам в сообщениях клиентов. */
function realTopics(){
  const buckets = [
    ['Наличие и цены', /цен|стои|сколько|наличи|есть ли|прайс/i],
    ['Доставка', /доставк|привез|срок|когда|отправ|курьер/i],
    ['Подбор под задачу', /подобрать|посовет|какой|подойд|нужн/i],
    ['Счёт и документы', /счёт|счет|инн|юрлиц|договор|документ|накладн/i],
  ];
  const counts = buckets.map(() => 0);
  S.dialogs.forEach(d => d.msgs.forEach(m => {
    if(m.r !== 'user') return;
    buckets.forEach(([, re], i) => { if(re.test(m.t)) counts[i]++; });
  }));
  // одно сообщение может попасть в несколько тем — делим на сумму попаданий,
  // иначе доли не сойдутся в 100%
  const hits = counts.reduce((a,b) => a + b, 0);
  if(!hits) return [];
  return buckets.map(([name], i) => [name, Math.round(counts[i] / hits * 100)]).filter(x => x[1] > 0).sort((a,b) => b[1] - a[1]);
}

        : `<div class="box" style="border-radius:18px;display:flex;flex-direction:column;gap:10px">
            <div class="between"><div style="font:600 16px/1 var(--f)">Демо-режим</div><div class="badge ai">OFFLINE</div></div>
            <div class="cap">Приложение открыто без сервера — расход AI считать нечего.</div>
          </div>`}
        <button class="btn ghost" data-act="close-sheet">Закрыть</button>`);
      return;
    }
    sheet(`<div class="h5" style="font-size:19px">Settings</div>
      <div class="list plain" style="padding:0 16px">
        <div class="between"><div style="font:500 15px/1 var(--f)">Бот</div><div class="cap">${S.bot.username ? '@' + esc(S.bot.username) : 'не подключён'}</div></div>
        ${S.bot.mask ? `<div class="between"><div style="font:500 15px/1 var(--f)">Токен</div><div class="cap" style="font-family:var(--m)">${esc(S.bot.mask)}</div></div>` : ''}
        <div class="between"><div style="font:500 15px/1 var(--f)">Приём сообщений</div><div class="cap" id="diag-mode">${NET.on ? (NET.mode === 'webhook' ? 'вебхук' : 'опрос Telegram') : 'демо-режим'}</div></div>
        <div class="between"><div style="font:500 15px/1 var(--f)">Модель</div><div class="cap" id="diag-model">${NET.on ? (NET.aiReady ? 'проверяю…' : 'не настроена') : 'локальные правила'}</div></div>
        <div class="between"><div style="font:500 15px/1 var(--f)">Язык интерфейса</div><div class="cap">Русский</div></div>
      </div>
      ${NET.on ? `<button class="btn ghost" style="color:#C93A3A" data-act="disconnect-bot">Отключить бота</button>` : ''}
      <button class="btn ghost" data-act="close-sheet">Закрыть</button>`, async () => {
        if(!NET.on || !NET.aiReady) return;
        try { const r = await NET.req('/api/diag', {}); const n = $('#diag-model'); if(n) n.textContent = r.diag.model || r.diag.modelError || '—'; }
        catch(e){ const n = $('#diag-model'); if(n) n.textContent = 'ошибка: ' + e.message; }
      });
  },
  'disconnect-bot': async () => {
    closeSheet();
    try { await NET.req('/api/bot/disconnect', {}); } catch(e){ return netErr(e); }
    S.bot = { token:'', name:'', username:'', subs:0, connected:false };
    save(); haptic('warn'); toast('Бот отключён — клиенты больше не получают ответы');
    paint(current, false);
  },
  'open-bot': () => {
    if(!NET.bot) return;
    const url = 'https://t.me/' + NET.bot;
    if(TG && TG.openTelegramLink) TG.openTelegramLink(url); else window.open(url, '_blank');
    // вернётся — перепроверим, снялась ли блокировка
    setTimeout(()=>{ NET.req('/api/notify/check', {}).then(r => {
      NET.notifyOk = r.reachable;
      if(r.reachable){ toast('Уведомления включены'); paint(current, false); }
    }).catch(()=>{}); }, 3000);
  },
  ext: (b) => {
    const url = b.dataset.url;
    if(TG && TG.openLink) TG.openLink(url); else window.open(url, '_blank');
  },
  'delete-account': () => {
    const d = S.dialogs.length, k = S.knowledge.length;
    sheet(`<div class="col g8"><div class="h5" style="font-size:19px">Удалить кабинет?</div>
        <div class="sub-s">Безвозвратно удалим ${d} ${plural(d,'диалог','диалога','диалогов')}, ${k} ${plural(k,'источник','источника','источников')} базы знаний, настройки и токен вашего бота. Бот перестанет отвечать клиентам.</div></div>
      <div class="field"><div class="lbl">Введите УДАЛИТЬ для подтверждения</div>
        <div class="inp"><input id="del-confirm" placeholder="УДАЛИТЬ" autocapitalize="characters"></div></div>
      <button class="btn" id="del-ok" style="background:#C93A3A">Удалить навсегда</button>
      <button class="link" data-act="close-sheet">Отмена</button>`, el => {
      $('#del-ok', el).addEventListener('click', async () => {
        const v = $('#del-confirm', el).value.trim().toUpperCase();
        if(v !== 'УДАЛИТЬ'){ toast('Введите слово УДАЛИТЬ'); return; }
        try { await NET.req('/api/account/delete', { confirm: 'УДАЛИТЬ' }); }
        catch(e){ return netErr(e); }
        closeSheet();
        try { localStorage.removeItem(KEY); } catch(e){}
        if(ES){ ES.close(); ES = null; }
        S = seed(); NET.me = null;
        haptic('warn'); stack = []; paint('welcome', false);
        toast('Кабинет удалён');
      });
    });
  },
  restart: () => {
    sheet(`<div class="col g8"><div class="h5" style="font-size:19px">Пройти настройку заново?</div>
        <div class="sub-s">Диалоги и клиенты сохранятся. Настройки бота и AI можно будет изменить.</div></div>
      <button class="btn" data-act="restart-ok">Начать заново</button>
      <button class="link" data-act="close-sheet">Отмена</button>`);
  },
  'team-done': () => { teamEdit = false; save(); haptic('ok'); paint('more', true); },
  'restart-ok': () => { closeSheet(); teamEdit = false; S.step = 0; save(); stack = []; go('welcome'); }
};

/**
 * Добавление источника в базу знаний.
 * С бэкендом текст реально уходит на сервер и попадает в промпт AI:
 * можно вставить текст, приложить текстовый файл (txt/md/csv/json) или дать ссылку.
 */
const KB_KIND_TITLE = { text:'Текст для AI', doc:'Документ', price:'Товары и цены', rules:'Правила', faq:'Частые вопросы', web:'Ссылка' };
const KB_KIND_HINT = () => ({
  text:  'Что важно знать про вашу работу: график, самовывоз, гарантии.',
  doc:   NET.on ? 'Приложите PDF, DOCX или вставьте текст документа.'
                : 'Вставьте текст документа или приложите .txt, .md, .csv.',
  price: NET.on ? 'Приложите XLSX или CSV с прайсом — или вставьте текстом, по строке на позицию.'
                : 'Вставьте прайс текстом или приложите CSV — по строке на позицию с ценой.',
  rules: 'Доставка, оплата, возврат — своими словами.',
  faq:   'Частые вопросы и ответы на них, по строке на пару.',
  web:   'Адрес страницы — прочитаем её и положим текст в базу знаний.',
});

function kbSheet(kind){
  const isWeb = kind === 'web';
  sheet(`<div class="col g8"><div class="h5" style="font-size:19px">${esc(KB_KIND_TITLE[kind] || 'Источник')}</div>
      <div class="sub-s">${esc(KB_KIND_HINT()[kind] || '')}</div></div>
    <div class="field"><div class="lbl">Название</div>
      <div class="inp"><input id="kb-title" placeholder="${isWeb ? 'nordlight.ru' : 'Каталог 2026'}"></div></div>
    ${isWeb ? '' : `<div class="field"><div class="lbl">Текст</div>
      <div class="inp"><textarea id="kb-body" rows="7" placeholder="Вставьте текст…"></textarea></div>
      <label class="chip add" style="align-self:flex-start;cursor:pointer" id="kb-pick">Приложить файл
        <input type="file" id="kb-file" accept=".pdf,.docx,.xlsx,.xlsm,.txt,.md,.csv,.tsv,.json,.html" style="display:none"></label>
      <div class="hint" id="kb-note">${NET.on
        ? 'PDF, DOCX, XLSX, CSV или TXT — прочитаем на сервере. Сканы без текстового слоя не подойдут.'
        : 'Без сервера читаем только текстовые файлы. Вставьте текст вручную.'}</div></div>`}
    <button class="btn" id="kb-ok">${isWeb ? 'Прочитать страницу' : 'Добавить в базу'}</button>`, el => {
    const title = $('#kb-title', el), bodyEl = $('#kb-body', el), note = $('#kb-note', el);
    const file = $('#kb-file', el);
    if(file) file.addEventListener('change', async () => {
      const f = file.files && file.files[0];
      if(!f) return;
      if(f.size > 8 * 1024 * 1024){ note.textContent = 'Файл больше 8 МБ — пришлите часть или ссылку.'; note.classList.add('err'); return; }
      note.classList.remove('err');

      if(NET.on){
        // Разбор PDF/DOCX/XLSX делает сервер — он же скажет, если файл нечитаемый.
        note.textContent = 'Читаю ' + f.name + '…';
        const pick = $('#kb-pick', el); if(pick) pick.style.opacity = '.5';
        try {
          const r = await NET.upload(f, title.value.trim());
          S.knowledge = r.knowledge; save(); haptic('ok');
          closeSheet();
          toast(r.title + ' — ' + Math.round(r.chars / 100) / 10 + ' тыс. знаков в базе');
          paint('knowledge', false);
        } catch(e){
          // Файл не прочитался — сразу показываем работающий путь, а не тупик.
          note.innerHTML = esc(e.message) + '<br><b style="color:var(--ink3)">Вставьте текст в поле выше — это сработает всегда.</b>';
          note.classList.add('err'); haptic('warn');
          if(!title.value) title.value = f.name.replace(/\.[a-z0-9]+$/i, '');
          bodyEl.focus();
        } finally {
          if(pick) pick.style.opacity = '';
          file.value = '';
        }
        return;
      }

      if(!/\.(txt|md|csv|tsv|json)$/i.test(f.name)){
        note.textContent = 'Без сервера читаю только txt, md, csv и json.'; note.classList.add('err'); return;
      }
      const r = new FileReader();
      r.onload = () => {
        bodyEl.value = String(r.result || '').slice(0, 60000);
        if(!title.value) title.value = f.name.replace(/\.[a-z0-9]+$/i, '');
        note.textContent = f.name + ' — ' + Math.round(bodyEl.value.length / 100) / 10 + ' тыс. знаков';
      };
      r.onerror = () => { note.textContent = 'Не смог прочитать файл'; note.classList.add('err'); };
      r.readAsText(f);
    });
    setTimeout(()=>title.focus(), 260);
    $('#kb-ok', el).addEventListener('click', async () => {
      const t = title.value.trim();
      if(isWeb){
        if(!t) return toast('Укажите адрес страницы');
        closeSheet(); toast('Читаем ' + t + '…');
        if(!NET.on){ addKB(Object.assign({}, KB_PRESET.web, { title:t, ready:true })); paint('knowledge', false); return; }
        try { const r = await NET.req('/api/knowledge/import', { url: t }); S.knowledge = r.knowledge; save(); haptic('ok');
          toast('Готово: ' + Math.round(r.chars/1000) + ' тыс. знаков'); paint('knowledge', false); }
        catch(e){ netErr(e); }
        return;
      }
      const body = bodyEl.value.trim();
      if(!t) return toast('Дайте источнику название');
      if(!body) return toast('Вставьте текст или приложите файл');
      closeSheet();
      if(!NET.on){
        addKB({ badge: (KB_PRESET[kind] || KB_PRESET.text).badge, title: t, meta: Math.round(body.length/100)/10 + ' тыс. знаков', kind, ready: true, body });
        save(); haptic('ok'); paint('knowledge', false); return;
      }
      try { const r = await NET.req('/api/knowledge/add', { kind, title: t, body }); S.knowledge = r.knowledge; save(); haptic('ok');
        toast('AI переобучен на этом источнике'); paint('knowledge', false); }
      catch(e){ netErr(e); }
    });
  });
}

function addKB(item){
  const i = S.knowledge.findIndex(k => k.kind === item.kind && k.title === item.title);
  if(i >= 0) S.knowledge[i] = item; else S.knowledge.push(item);
  save();
  return item;
}
function repaintMats(){ const n = $('#mats'); if(n) n.innerHTML = matList(); }

/* ---------- делегирование событий ---------- */
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  const el = e.target.closest('[data-act]');
  if(el){
    const a = el.dataset.act;
    if(ACT[a]){ e.preventDefault(); ACT[a](el, e); return; }
  }
  if(tabBtn && tabBtn.classList.contains('tab')){ ACT.tab(tabBtn); }
});

/* ============================================================
   Инициализация
   ============================================================ */
async function init(){
  load();
  if(TG){
    try{
      TG.ready(); TG.expand();
      if(TG.setHeaderColor) TG.setHeaderColor('#FFFFFF');
      if(TG.setBackgroundColor) TG.setBackgroundColor('#FFFFFF');
      if(TG.disableVerticalSwipes) TG.disableVerticalSwipes();
      TG.BackButton.onClick(() => back());
      const u = TG.initDataUnsafe && TG.initDataUnsafe.user;
      if(u && !S.team.length && S.onboarded)
        S.team.push({ name:[u.first_name,u.last_name].filter(Boolean).join(' '), un:u.username||'me', role:'владелец', dept:'Sales' });
    }catch(e){}
  }
  const start = S.onboarded ? (VIEWS[S.view] && !ONB.includes(S.view) ? S.view : 'home') : (S.step ? ONB[Math.min(S.step, ONB.length-1)] : 'welcome');
  paint(start, false);
  save();

  /* С бэкендом источник правды — сервер: перерисовываем по его состоянию. */
  if(NET.on){
    NET.initData = (TG && TG.initData) || (CFG && CFG.devInitData) || '';
    try {
      const r = await NET.req('/api/state', {});
      NET.me = r.me; NET.ready = true;
      applyState(r.state);
      // Диплинк из уведомления «AI передал диалог»: t.me/bot?startapp=d<chatId>
      const start = (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || '';
      const wantChat = /^d(-?\d+)$/.exec(start);
      let view = S.onboarded ? (VIEWS[S.view] && !ONB.includes(S.view) ? S.view : 'home')
                             : (S.step ? ONB[Math.min(S.step, ONB.length-1)] : 'welcome');
      if(wantChat && S.dialogs.some(d => d.id === wantChat[1])){
        S.openChat = wantChat[1];
        view = 'chat';
      }
      stack = view === 'chat' ? ['inbox'] : [];
      paint(view, false);
      openStream();
      // Тихо выясняем, сможет ли бот написать владельцу про переданные диалоги.
      if(S.onboarded) NET.req('/api/notify/check', {}).then(r => {
        if(NET.notifyOk !== r.reachable){ NET.notifyOk = r.reachable; if(current === 'home') paint('home', false); }
      }).catch(()=>{});
    } catch(e){
      NET.ready = false;
      toast(/подпись|401/i.test(e.message) ? 'Откройте приложение из Telegram — иначе сервер не пускает' : 'Сервер недоступен: ' + e.message);
    }
  }

  /* Офлайн-демо: имитируем входящие. С бэкендом это не нужно — пишут реальные клиенты. */
  setInterval(() => {
    if(NET.on) return;
    if(!S.onboarded || current !== 'chat') return;
    const d = S.dialogs.find(x=>x.id===S.openChat);
    if(!d || d.status === 'closed') return;
    if(now() - d.ts < 40000) return;
    if(Math.random() > 0.35) return;
    const qs = ['А доставка когда будет?','Можно фото?','Сколько по деньгам выйдет?','Есть в наличии сейчас?'];
    simulateIncoming(d, qs[Math.floor(Math.random()*qs.length)]);
  }, 15000);
}
init();
</script>
