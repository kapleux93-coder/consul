# Деплой на Render. Free-плана хватает, чтобы начать.
#
# После создания сервиса задайте в панели два секрета — GROQ_API_KEY и BOT_TOKEN —
# и один раз выполните в Shell: npm run setup
# PUBLIC_URL подставляется сам из RENDER_EXTERNAL_URL.
#
# Диск обязателен: на нём кабинеты пользователей и ключ шифрования токенов.
services:
  - type: web
    name: consul
    runtime: node
    plan: free
    buildCommand: "echo зависимостей нет"
    startCommand: "node server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CONSUL_DATA_DIR
        value: /var/data
      - key: GROQ_API_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: CONSUL_ENC_KEY
        generateValue: true
      - key: PLATFORM_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_IDS
        sync: false
    disk:
      name: consul-data
      mountPath: /var/data
      sizeGB: 1
